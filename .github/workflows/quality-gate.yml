name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: smoke-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: smoke.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: smoke-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: smoke.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abc123"
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-TEST1234
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: smoke-site-key
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (fail on moderate+)
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('audit.json','utf8'));const m=(r.metadata&&r.metadata.vulnerabilities)||{};const low=m.low||0,moderate=m.moderate||0,high=m.high||0,critical=m.critical||0;console.log('audit summary:',{low,moderate,high,critical});if(moderate+high+critical>0){process.exit(1)}"

      - name: Run verify
        run: npm run verify

  functions-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci

      - name: Lint functions
        run: npm run lint

  rules-semantic:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic emulator rules tests
        run: npm run test:rules

  smoke:
    runs-on: ubuntu-latest
    needs: [verify, functions-verify, rules-semantic]
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: smoke-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: smoke.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: smoke-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: smoke.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abc123"
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-TEST1234
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: smoke-site-key
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke E2E
        run: npm run test:e2e:smoke
