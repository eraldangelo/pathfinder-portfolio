name: Ops Drift Verification

on:
  schedule:
    - cron: '40 2 * * *'
  workflow_dispatch:
    inputs:
      allow_app_check_unenforced:
        description: Allow UNENFORCED App Check mode for drift checks
        required: false
        default: false
        type: boolean
      allow_ttl_creating:
        description: Allow Firestore TTL state CREATING during rollout
        required: false
        default: false
        type: boolean

jobs:
  verify-ops-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ops-drift-verification-prod
      cancel-in-progress: false
    env:
      PATHFINDER_GCP_PROJECT: ${{ vars.PATHFINDER_GCP_PROJECT }}
      PATHFINDER_GCP_REGION: ${{ vars.PATHFINDER_GCP_REGION }}
      PATHFINDER_CLOUD_RUN_SERVICE: ${{ vars.PATHFINDER_CLOUD_RUN_SERVICE }}
      PATHFINDER_BASE_URL: ${{ vars.PATHFINDER_BASE_URL }}
      ALLOW_APPCHECK_UNENFORCED: ${{ github.event.inputs.allow_app_check_unenforced || 'false' }}
      ALLOW_TTL_CREATING: ${{ github.event.inputs.allow_ttl_creating || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Validate workload identity configuration
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GCP_WIF_PROVIDER" ] || [ -z "$GCP_WIF_SERVICE_ACCOUNT" ]; then
            echo "Missing required secrets for ops drift verification."
            echo "Set repository secrets: GCP_WIF_PROVIDER and GCP_WIF_SERVICE_ACCOUNT."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Install dependencies
        run: npm ci

      - name: Verify production ops drift baseline
        run: |
          PROJECT="${PATHFINDER_GCP_PROJECT:-your-gcp-project}"
          REGION="${PATHFINDER_GCP_REGION:-asia-southeast1}"
          SERVICE="${PATHFINDER_CLOUD_RUN_SERVICE:-pathfinder}"
          BASE_URL="${PATHFINDER_BASE_URL:-https://your-app.example.com/}"

          FLAGS=""
          if [ "$ALLOW_APPCHECK_UNENFORCED" = "true" ]; then
            FLAGS="$FLAGS --allow-app-check-unenforced"
          fi
          if [ "$ALLOW_TTL_CREATING" = "true" ]; then
            FLAGS="$FLAGS --allow-ttl-creating"
          fi

          npm run ops:check:deploy-drift -- --project="$PROJECT" --region="$REGION" --service="$SERVICE" --base-url="$BASE_URL" $FLAGS
