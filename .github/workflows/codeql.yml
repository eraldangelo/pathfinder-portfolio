name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c # v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c # v3

      - name: Detect code scanning upload availability
        id: code_scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}")"
          STATUS="$(echo "${RESPONSE}" | jq -r '.security_and_analysis.code_scanning.status // "unavailable"')"

          if [ "${STATUS}" = "enabled" ]; then
            echo "upload_mode=always" >> "$GITHUB_OUTPUT"
            echo "Code scanning upload is enabled."
          else
            echo "upload_mode=never" >> "$GITHUB_OUTPUT"
            echo "Code scanning upload is unavailable (status=${STATUS}). Running CodeQL in artifact-only mode."
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@3b1a19a80ab047f35cbb237b5bd9bdc1e14f166c # v3
        with:
          category: /language:javascript-typescript
          output: results
          upload: ${{ steps.code_scanning.outputs.upload_mode }}

      - name: Upload CodeQL SARIF artifact (fallback)
        if: ${{ steps.code_scanning.outputs.upload_mode == 'never' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-sarif-javascript-typescript
          path: results/*.sarif
          if-no-files-found: warn
